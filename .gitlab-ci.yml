# ─── CI/CD — API NestJS (@health/api) ────────────────────────────────────────
#
# CI config path : apps/api/.gitlab-ci.yml
#
# Variables groupe GitLab (définir une seule fois sur le groupe) :
#   SSH_PRIVATE_KEY        — clé privée (type File)
#   DEPLOY_HOST            — IP du serveur
#   DEPLOY_USER            — ex : ubuntu
#   DEPLOY_DIR             — /opt/apps/doctor-patient
#   API_PROD_URL           — http://api.83-228-225-92.nip.io

stages:
  - build
  - deploy

# ── SSH helper ────────────────────────────────────────────────────────────────

.ssh-before: &ssh-before
  - apk add --no-cache openssh-client bash
  - eval $(ssh-agent -s)
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  - cat "$SSH_PRIVATE_KEY" > /tmp/id_deploy
  - echo >> /tmp/id_deploy
  - chmod 600 /tmp/id_deploy
  - ssh-add /tmp/id_deploy
  - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

# ── Build & push (kaniko) ─────────────────────────────────────────────────────

build:api:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_JOB_TOKEN | base64 -w 0)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE:latest"
      --cache=true
      --cache-ttl=24h

# ── Deploy ────────────────────────────────────────────────────────────────────

deploy:api:
  stage: deploy
  image: alpine:3.19
  needs: ["build:api"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: api/production
    url: $API_PROD_URL
  before_script:
    - *ssh-before
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "bash $DEPLOY_DIR/infra/scripts/deploy.sh api $CI_COMMIT_SHORT_SHA"
