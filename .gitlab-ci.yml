# ─── CI/CD — API NestJS (@health/api) ────────────────────────────────────────
#
# Pipeline autonome — à configurer comme CI config path dans le projet GitLab :
#   Settings → CI/CD → General pipelines → CI/CD configuration file
#   → apps/api/.gitlab-ci.yml
#
# Déclencheurs :
#   • Push sur n'importe quelle branche / MR   → test
#   • Push sur main                            → test + build image + deploy staging
#   • Tag api/v*.*.*                           → test + build image + deploy production (manuel)
#
# Variables CI/CD à configurer (GitLab → Settings → CI/CD → Variables, masked + protected) :
#   SSH_PRIVATE_KEY   — clé privée pour se connecter au serveur
#   DEPLOY_HOST       — IP ou hostname du serveur
#   DEPLOY_USER       — utilisateur SSH (ex : deploy)
#   DEPLOY_DIR        — /opt/apps/doctor-patient
#   API_STAGING_URL   — URL publique staging
#   API_PROD_URL      — URL publique production

stages:
  - test
  - build
  - staging
  - production

.api-node-base:
  image: node:20-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@9 --activate
    - pnpm install --no-frozen-lockfile

# ── SSH helper ────────────────────────────────────────────────────────────────

.ssh-before: &ssh-before
  - apk add --no-cache openssh-client bash
  - eval $(ssh-agent -s)
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  - cat "$SSH_PRIVATE_KEY" > /tmp/id_deploy
  - echo >> /tmp/id_deploy
  - chmod 600 /tmp/id_deploy
  - ssh-add /tmp/id_deploy
  - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

# ── Validation README ─────────────────────────────────────────────────────────

validate:readme:api:
  image: node:20-alpine
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^api\/v.*/
  script:
    - node scripts/validate-readme.js
  allow_failure: false

# ── Test ──────────────────────────────────────────────────────────────────────

test:api:
  extends: .api-node-base
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^api\/v.*/
  script:
    - pnpm test:cov
  coverage: '/Lines\s*:\s*\d+\.?\d+%/'
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week

# ── Build image Docker ────────────────────────────────────────────────────────

build:api:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: ["test:api"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^api\/v.*/
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_JOB_TOKEN | base64 -w 0)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE/api:latest"
      --cache=true
      --cache-ttl=24h

# ── Deploy staging ────────────────────────────────────────────────────────────

deploy:api:staging:
  stage: staging
  image: alpine:3.19
  needs: ["build:api"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: api/staging
    url: $API_STAGING_URL
  before_script:
    - *ssh-before
  script:
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" \
        "REGISTRY=$CI_REGISTRY \
         REGISTRY_USER=$CI_REGISTRY_USER \
         REGISTRY_PASSWORD=$CI_JOB_TOKEN \
         bash $DEPLOY_DIR/infra/scripts/deploy.sh api $CI_COMMIT_SHORT_SHA"

# ── Deploy production ─────────────────────────────────────────────────────────

deploy:api:production:
  stage: production
  image: alpine:3.19
  needs: ["build:api"]
  when: manual
  rules:
    - if: $CI_COMMIT_TAG =~ /^api\/v.*/
      when: manual
  environment:
    name: api/production
    url: $API_PROD_URL
  before_script:
    - *ssh-before
  script:
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" \
        "REGISTRY=$CI_REGISTRY \
         REGISTRY_USER=$CI_REGISTRY_USER \
         REGISTRY_PASSWORD=$CI_JOB_TOKEN \
         bash $DEPLOY_DIR/infra/scripts/deploy.sh api $CI_COMMIT_TAG"
