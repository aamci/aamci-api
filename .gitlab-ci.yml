# ─── CI/CD — API NestJS (@health/api) ────────────────────────────────────────
#
# Pipeline autonome — à configurer comme CI config path dans le projet GitLab :
#   Settings → CI/CD → General pipelines → CI/CD configuration file
#   → apps/api/.gitlab-ci.yml
#
# Déclencheurs :
#   • Push sur n'importe quelle branche / MR   → test
#   • Push sur main                            → test + deploy (build sur serveur)
#
# Variables CI/CD à configurer (GitLab → Settings → CI/CD → Variables, masked + protected) :
#   SSH_PRIVATE_KEY   — clé privée (type File) pour se connecter au serveur
#   DEPLOY_HOST       — IP du serveur
#   DEPLOY_USER       — utilisateur SSH (ex : ubuntu)
#   DEPLOY_DIR        — /opt/apps/doctor-patient
#   API_PROD_URL      — URL publique (ex : http://api.1-2-3-4.nip.io)

stages:
  - test
  - deploy

.api-node-base:
  image: node:20-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@9 --activate
    - pnpm install --no-frozen-lockfile

# ── SSH helper ────────────────────────────────────────────────────────────────

.ssh-before: &ssh-before
  - apk add --no-cache openssh-client bash
  - eval $(ssh-agent -s)
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  - cat "$SSH_PRIVATE_KEY" > /tmp/id_deploy
  - echo >> /tmp/id_deploy
  - chmod 600 /tmp/id_deploy
  - ssh-add /tmp/id_deploy
  - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

# ── Test ──────────────────────────────────────────────────────────────────────

test:api:
  extends: .api-node-base
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - pnpm test:cov
  coverage: '/Lines\s*:\s*\d+\.?\d+%/'
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week

# ── Deploy (build sur serveur) ────────────────────────────────────────────────

deploy:api:
  stage: deploy
  image: alpine:3.19
  needs: ["test:api"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: api/production
    url: $API_PROD_URL
  before_script:
    - *ssh-before
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "bash $DEPLOY_DIR/infra/scripts/deploy.sh api"
