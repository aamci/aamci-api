# ─── CI/CD — API NestJS (@health/api) ────────────────────────────────────────
#
# CI config path : apps/api/.gitlab-ci.yml
#
# Variables groupe GitLab (définir une seule fois sur le groupe) :
#   SSH_PRIVATE_KEY        — clé privée (type File)
#   DEPLOY_HOST            — IP du serveur
#   DEPLOY_USER            — ex : ubuntu
#   DEPLOY_DIR             — /opt/apps/doctor-patient
#   API_PROD_URL           — http://api.38.247.138.247.nip.io
#   API_PREPROD_URL        — http://preprod-api.38.247.138.247.nip.io

stages:
  - build
  - deploy
  - migrate
  - seed
  - schema

# ── SSH helper ────────────────────────────────────────────────────────────────

.ssh-before: &ssh-before
  - apk add --no-cache openssh-client bash
  - eval $(ssh-agent -s)
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  - cat "$SSH_PRIVATE_KEY" > /tmp/id_deploy
  - echo >> /tmp/id_deploy
  - chmod 600 /tmp/id_deploy
  - ssh-add /tmp/id_deploy
  - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

# ── Build & push (kaniko) — prod ──────────────────────────────────────────────

build:api:
  stage: build
  tags:
    - docker
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_JOB_TOKEN | base64 -w 0)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE:latest"
      --cache=true
      --cache-ttl=24h

# ── Build & push (kaniko) — preprod ──────────────────────────────────────────

build:api:preprod:
  stage: build
  tags:
    - docker
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "preprod"
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_JOB_TOKEN | base64 -w 0)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:preprod-$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE:preprod"
      --cache=true
      --cache-ttl=24h

# ── Deploy — prod ─────────────────────────────────────────────────────────────

deploy:api:
  stage: deploy
  tags:
    - docker
  image: alpine:3.19
  needs: ["build:api"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: api/production
    url: $API_PROD_URL
  before_script:
    - *ssh-before
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "bash $DEPLOY_DIR/infra/scripts/deploy.sh api $CI_COMMIT_SHORT_SHA prod"

# ── Deploy — preprod ──────────────────────────────────────────────────────────

deploy:api:preprod:
  stage: deploy
  tags:
    - docker
  image: alpine:3.19
  needs: ["build:api:preprod"]
  rules:
    - if: $CI_COMMIT_BRANCH == "preprod"
  environment:
    name: api/preprod
    url: $API_PREPROD_URL
  before_script:
    - *ssh-before
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "bash $DEPLOY_DIR/infra/scripts/deploy.sh api preprod-$CI_COMMIT_SHORT_SHA preprod"

# ── Migration DB (manuel) ─────────────────────────────────────────────────────
#
# Déclencher via : GitLab → Pipelines → Run pipeline → variables :
#   MIGRATE_SRC_DOCKER  ex: health_postgres
#   MIGRATE_SRC_URL     ex: postgresql://user:pass@old-host:5432/db  (si source distante)
#   MIGRATE_DST_URL     ex: postgresql://user:pass@new-host:5432/db
#   MIGRATE_DST_DOCKER  ex: health_postgres_new  (si cible locale)
#   MIGRATE_SCHEMA_ONLY true  (optionnel)
#   MIGRATE_DATA_ONLY   true  (optionnel)
#   MIGRATE_TABLES      User,Appointment  (optionnel)
#
# Variables à définir dans GitLab → Settings → CI/CD → Variables :
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_DIR, SSH_PRIVATE_KEY (déjà présentes)

migrate:db:
  stage: migrate
  tags:
    - docker
  image: alpine:3.19
  rules:
    - when: manual
      allow_failure: true
  before_script:
    - *ssh-before
  script:
    - |
      EXTRA_FLAGS=""
      [ "${MIGRATE_SCHEMA_ONLY:-}" = "true" ] && EXTRA_FLAGS="$EXTRA_FLAGS --schema-only"
      [ "${MIGRATE_DATA_ONLY:-}"   = "true" ] && EXTRA_FLAGS="$EXTRA_FLAGS --data-only"
      [ -n "${MIGRATE_TABLES:-}"            ] && EXTRA_FLAGS="$EXTRA_FLAGS --tables '${MIGRATE_TABLES}'"

      ssh "$DEPLOY_USER@$DEPLOY_HOST" "bash $DEPLOY_DIR/infra/scripts/migrate-db.sh \
        ${MIGRATE_SRC_DOCKER:+--src-docker '$MIGRATE_SRC_DOCKER'} \
        ${MIGRATE_SRC_URL:+--src-url '$MIGRATE_SRC_URL'} \
        ${MIGRATE_DST_DOCKER:+--dst-docker '$MIGRATE_DST_DOCKER'} \
        ${MIGRATE_DST_URL:+--dst-url '$MIGRATE_DST_URL'} \
        $EXTRA_FLAGS"
  artifacts:
    when: always
    paths:
      - /tmp/restore_log.txt
    expire_in: 7 days

# ── Seed DB (manuel) ─────────────────────────────────────────────────────────
#
# Déclencher via : GitLab → Pipelines → Run pipeline
# Le seed utilise dist/prisma/seed.js compilé dans l'image de production.
# ⚠ Attention : le seed recrée les données de base (idempotent via upsert).

seed:db:
  stage: seed
  tags:
    - docker
  image: alpine:3.19
  rules:
    - when: manual
      allow_failure: true
  before_script:
    - *ssh-before
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "docker exec health-api-1 node dist/prisma/seed.js"

# ── Prisma DB Push (manuel) ──────────────────────────────────────────────────
#
# Applique le schéma Prisma directement sur la DB sans créer de migration.
# Déclencher via : GitLab → Pipelines → Run pipeline
# ⚠ Peut modifier ou supprimer des colonnes — à utiliser avec précaution en prod.

db:push:
  stage: schema
  tags:
    - docker
  image: alpine:3.19
  rules:
    - when: manual
      allow_failure: true
  before_script:
    - *ssh-before
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "docker exec health-api-1 npx prisma db push --skip-generate --accept-data-loss"

# ── Backup DB (manuel ou planifié) ───────────────────────────────────────────

backup:db:
  stage: migrate
  tags:
    - docker
  image: alpine:3.19
  rules:
    - when: manual
      allow_failure: true
  before_script:
    - *ssh-before
  script:
    - |
      BACKUP_PATH="/opt/backups/health/backup_${CI_COMMIT_SHORT_SHA:-manual}_$(date +%Y%m%d_%H%M%S).sql"
      ssh "$DEPLOY_USER@$DEPLOY_HOST" "bash $DEPLOY_DIR/infra/scripts/migrate-db.sh \
        --src-docker health_postgres \
        --dump-only \
        --out '$BACKUP_PATH'"
      echo "Backup disponible sur le serveur : $BACKUP_PATH"
